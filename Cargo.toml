[package]
name = "hollow-signal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fog-soaked terminal FPS for local network deathmatch"
license = "MIT"

[dependencies]
ratatui = "=0.30.2"
crossterm = "=0.29.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = "=1.3.3"
rand = "0.8.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

